run:
  susier: True
  ld_correlation: False
study: "gnh"
ld:
  source: external
  directory: "ld/ld_matrix"

 # The pipe will enable the use of correlation matrix based on LD as specified in link below:
 # https://stephenslab.github.io/susieR/articles/finemapping_summary_statistics.html
 # If set to False (default), it will use the genotypes coded with additive model
 # together with the phenotype to evaluate the RSS model.


# paths
workspace_path: "results/gnh_93"
path_lb: "config/gnh_93.csv"
path_gwas: "../pqtl_coloc/results/believe_cis_quant/tmp/gwas" #"/exchange/healthds/pQTL/BELIEVE/harmonized_gwas/"
genotype:  "/exchange/healthds/pQTL/BELIEVE/harmonized_genotype/pgen/chr"
path_pheno: "data/INTERVAL_NonImp_residuals_final.txt"


sumstat:
  pvalcol: "MLOG10P"
  snpcol: "SNPID"
  chrcol: "CHR"
  ncol: "meta_total_samples"
  n_samples: 9216


# SusieR parameters
susieR:
 min_abs_corr: 0.5
 iter: 1000
 L: 10
 extension: 100000
 estimate_residual_variance: FALSE

